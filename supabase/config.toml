# Supabase CLI configuration for local development (`supabase start`).
# The CLI runs the whole stack (Postgres, Realtime, Auth, Studio) in Docker.

project_id = "ubomber"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]

[inbucket]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false
